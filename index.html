/* ─── AlifeCanvas ───────────────────────────────────────── */
const AlifeCanvas = () => {
  const ref = React.useRef(null);
  const [opacity, setOpacity] = React.useState(0.18);
  const [simName, setSimName] = React.useState('');

  React.useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) return;
    const c = ref.current;
    if (!c) return;
    const ctx = c.getContext('2d');
    const resize = () => { c.width = window.innerWidth; c.height = window.innerHeight; };
    resize();
    window.addEventListener('resize', resize);

    const sims = ['boids', 'reaction-diffusion', 'game-of-life'];
    const names = { 'boids': 'boids flocking', 'reaction-diffusion': 'reaction-diffusion', 'game-of-life': 'game of life' };
    const choice = sims[Math.floor(Math.random() * sims.length)];
    setSimName(names[choice]);

    let raf;

    if (choice === 'boids') {
      const N = 80;
      const agents = Array.from({ length: N }, () => ({
        x: Math.random() * c.width, y: Math.random() * c.height,
        vx: (Math.random() - 0.5) * 1.2, vy: (Math.random() - 0.5) * 1.2
      }));
      const step = () => {
        ctx.fillStyle = 'rgba(248,250,247,0.08)';
        ctx.fillRect(0, 0, c.width, c.height);
        for (const a of agents) {
          let ax = 0, ay = 0, cx = 0, cy = 0, sx = 0, sy = 0, n = 0;
          for (const b of agents) {
            if (b === a) continue;
            const dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
            if (d2 < 3000) { ax += b.vx; ay += b.vy; cx += b.x; cy += b.y; n++; if (d2 < 500) { sx -= dx; sy -= dy; } }
          }
          if (n) {
            a.vx += (ax / n - a.vx) * 0.04; a.vy += (ay / n - a.vy) * 0.04;
            a.vx += (cx / n - a.x) * 0.0008; a.vy += (cy / n - a.y) * 0.0008;
            a.vx += sx * 0.02; a.vy += sy * 0.02;
          }
          const s = Math.hypot(a.vx, a.vy);
          if (s > 1.8) { a.vx *= 1.8 / s; a.vy *= 1.8 / s; }
          a.x += a.vx; a.y += a.vy;
          if (a.x < 0) a.x += c.width; if (a.x > c.width) a.x -= c.width;
          if (a.y < 0) a.y += c.height; if (a.y > c.height) a.y -= c.height;
          ctx.fillStyle = '#2D8A4E';
          ctx.beginPath(); ctx.arc(a.x, a.y, 1.8, 0, Math.PI * 2); ctx.fill();
        }
        raf = requestAnimationFrame(step);
      };
      step();

    } else if (choice === 'reaction-diffusion') {
      const W = Math.floor(c.width / 4), H = Math.floor(c.height / 4);
      const size = W * H;
      let a = new Float32Array(size).fill(1);
      let b = new Float32Array(size);
      let na = new Float32Array(size);
      let nb = new Float32Array(size);
      for (let i = Math.floor(H/2)-10; i < Math.floor(H/2)+10; i++)
        for (let j = Math.floor(W/2)-10; j < Math.floor(W/2)+10; j++)
          b[i * W + j] = 1;
      const dA = 1.0, dB = 0.5, f = 0.055, k = 0.062;
      const lap = (arr, i, j) => {
        const up = ((i - 1 + H) % H) * W + j;
        const dn = ((i + 1) % H) * W + j;
        const lt = i * W + (j - 1 + W) % W;
        const rt = i * W + (j + 1) % W;
        return arr[up] + arr[dn] + arr[lt] + arr[rt] - 4 * arr[i * W + j];
      };
      const step = () => {
        for (let i = 0; i < H; i++) for (let j = 0; j < W; j++) {
          const idx = i * W + j;
          const av = a[idx], bv = b[idx], abb = av * bv * bv;
          na[idx] = Math.max(0, Math.min(1, av + dA * lap(a,i,j) - abb + f * (1 - av)));
          nb[idx] = Math.max(0, Math.min(1, bv + dB * lap(b,i,j) + abb - (k + f) * bv));
        }
        [a, na] = [na, a]; [b, nb] = [nb, b];
        ctx.clearRect(0, 0, c.width, c.height);
        const img = ctx.createImageData(W, H);
        for (let i = 0; i < size; i++) {
          const t = b[i]; // 0 = background, 1 = chemical B pattern
          img.data[i*4]   = Math.floor(45  + (1 - t) * 203);  // R: 45→248
          img.data[i*4+1] = Math.floor(138 + (1 - t) * 112);  // G: 138→250
          img.data[i*4+2] = Math.floor(78  + (1 - t) * 169);  // B: 78→247
          img.data[i*4+3] = Math.floor(220 * t + 8);           // alpha: transparent bg, visible pattern
        }
        const tmp = document.createElement('canvas');
        tmp.width = W; tmp.height = H;
        tmp.getContext('2d').putImageData(img, 0, 0);
        ctx.drawImage(tmp, 0, 0, c.width, c.height);
        raf = requestAnimationFrame(step);
      };
      step();

    } else {
      const SCALE = 6;
      const cols = Math.floor(c.width / SCALE), rows = Math.floor(c.height / SCALE);
      let grid = Array.from({ length: rows }, () => Array.from({ length: cols }, () => Math.random() > 0.7 ? 1 : 0));
      const nextGrid = (g) => g.map((row, r) => row.map((cell, c2) => {
        let n = 0;
        for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          n += g[(r + dr + rows) % rows][(c2 + dc + cols) % cols];
        }
        return (cell && (n === 2 || n === 3)) || (!cell && n === 3) ? 1 : 0;
      }));
      let frame = 0;
      const step = () => {
        if (frame % 4 === 0) {
          ctx.clearRect(0, 0, c.width, c.height);
          ctx.fillStyle = '#2D8A4E';
          grid.forEach((row, r) => row.forEach((cell, c2) => {
            if (cell) ctx.fillRect(c2 * SCALE, r * SCALE, SCALE - 1, SCALE - 1);
          }));
          grid = nextGrid(grid);
        }
        frame++;
        raf = requestAnimationFrame(step);
      };
      step();
    }

    const onScroll = () => {
      const t = Math.min(window.scrollY / window.innerHeight, 1);
      setOpacity(0.18 - t * 0.14);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener('resize', resize);
      window.removeEventListener('scroll', onScroll);
    };
  }, []);

  return (
    <>
      <canvas ref={ref} id="alife-bg" style={{ opacity }} aria-hidden="true" />
      {simName && <span id="alife-label" aria-hidden="true">running: {simName}</span>}
    </>
  );
};

/* ─── App ───────────────────────────────────────────────── */
const App = () => {
  const [active, setActive] = React.useState('hero');

  const onNav = (id) => {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    setActive(id);
  };

  React.useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const setup = () => {
      const fadeEls = document.querySelectorAll('.fade-in');
      if (reduced) { fadeEls.forEach(el => el.classList.add('visible')); return; }
      const obs = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) { entry.target.classList.add('visible'); obs.unobserve(entry.target); }
        });
      }, { threshold: 0.12 });
      fadeEls.forEach(el => obs.observe(el));
      return () => obs.disconnect();
    };
    const t = setTimeout(setup, 50);
    return () => clearTimeout(t);
  }, []);

  return (
    <>
      <AlifeCanvas />
      <Nav active={active} onNav={onNav} />
      <main id="main">
        <Hero />
        <About />
        <Research />
        <Work />
        <Teaching />
        <Pedagogy />
        <Projects />
        <Contact />
        <SiteFooter />
      </main>
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
